name: Signaturschlüssel ins Repo sichern

# Einmalig von Hand zu starten (Actions -> Signaturschlüssel ins Repo sichern -> Run workflow).
#
# Hintergrund: Der Schlüssel lag bisher ausschließlich in einem Actions-Cache. Solche
# Caches werden nach sieben Tagen ohne Zugriff gelöscht — danach erzeugte der Build
# stillschweigend einen neuen Schlüssel, und installierte Apps ließen sich nicht mehr
# aktualisieren („Paket steht in Konflikt mit einem bestehenden Paket"). Genau das ist
# zwischen 0.60.1 und 0.61.0 passiert.
#
# Dieser Workflow holt den aktuell gecachten Schlüssel und legt ihn als Datei ins Repo.
# Ab dann ist der Cache bedeutungslos und die Signatur bleibt stabil.
#
# Läuft absichtlich nur manuell und bricht ab, wenn schon ein Schlüssel im Repo liegt:
# ihn zu ersetzen würde genau die Update-Fähigkeit brechen, um die es hier geht.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sichern:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Abbrechen, wenn der Schlüssel schon im Repo liegt
        run: |
          if [ -f android/app/familyplanner.keystore ]; then
            echo "::error::android/app/familyplanner.keystore liegt bereits im Repo. Ein Austausch würde Updates auf installierten Geräten unmöglich machen."
            exit 1
          fi

      - name: Schlüssel aus dem Cache holen
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/familyplanner.keystore
          key: signing-keystore-v1

      - name: Abbrechen, wenn der Cache leer ist
        run: |
          if [ ! -f android/app/familyplanner.keystore ]; then
            echo "::error::Im Cache liegt kein Schlüssel mehr. Ohne ihn lässt sich die Signatur der zuletzt veröffentlichten APK nicht fortführen — dann hilft nur ein neuer Schlüssel und einmaliges Deinstallieren."
            exit 1
          fi
          echo "Gefunden: $(stat -c%s android/app/familyplanner.keystore) Bytes"

      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f, weil .gitignore Keystores grundsätzlich ausschließt. Hier ist es
          # gewollt: das Repo ist privat, und der Schlüssel muss den Cache überleben.
          git add -f android/app/familyplanner.keystore
          git commit -m "Signaturschlüssel ins Repo übernommen (überlebt den Actions-Cache)"
          git push
